name: Build RomsHelper

on:
  workflow_dispatch:

jobs:

  # -----------------------------
  # Linux
  # -----------------------------
  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean dist
        run: rm -rf dist/*
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build binary
        run: pyinstaller --clean --onefile --paths . RomsHelper.py
      - name: Make everything executable
        run: chmod +x dist/*
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomsHelper-linux-x86_64
          path: dist/

  # -----------------------------
  # Windows
  # -----------------------------
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean dist
        run: Remove-Item -Recurse -Force dist\* -ErrorAction SilentlyContinue
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build binary
        run: pyinstaller --clean --onefile --paths . --icon assets/icon.ico RomsHelper.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomsHelper-windows-x86_64
          path: dist/

  # -----------------------------
  # macOS
  # -----------------------------
  mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean dist
        run: rm -rf dist/*
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build binary
        run: pyinstaller --clean --onefile --paths . RomsHelper.py
      - name: Build macOS icon
        run: |
          mkdir RomsHelper.iconset
          sips -z 16 16     assets/icon.png --out RomsHelper.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out RomsHelper.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out RomsHelper.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out RomsHelper.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out RomsHelper.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out RomsHelper.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out RomsHelper.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out RomsHelper.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out RomsHelper.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out RomsHelper.iconset/icon_512x512@2x.png
          iconutil -c icns RomsHelper.iconset
      - name: Prepare .app bundle
        run: |
          mkdir -p dist/RomsHelper.app/Contents/{MacOS,Resources}
          cp dist/RomsHelper dist/RomsHelper.app/Contents/MacOS/
          cp RomsHelper.icns dist/RomsHelper.app/Contents/Resources/
          cp wrapper-scripts/MacOS/Info.plist dist/RomsHelper.app/Contents/
          chmod +x dist/RomsHelper.app/Contents/MacOS/*
      - name: Remove standalone binary
        run: rm -f dist/RomsHelper
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomsHelper-macos-universal
          path: dist/
